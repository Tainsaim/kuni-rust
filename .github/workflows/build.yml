name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          set -o pipefail
          cargo build --locked --color never 2>&1 | tail -n 300

      - name: Test
        run: |
          set -o pipefail
          cargo test --locked --color never 2>&1 | tail -n 100
