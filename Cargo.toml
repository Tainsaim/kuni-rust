[package]
name = "kuni-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util", "signal"] }
grammers-client = { version = "0.11", features = ["parse_invite_link"] }
grammers-mtsender = "0.11"
grammers-session = "0.11"
grammers-tl-types = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
futures = "0.3"
rand = "0.9"
jiff = { version = "0.2", features = ["serde"] }
notify = "8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
opt-level = 2
